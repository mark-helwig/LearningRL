[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "LearningRLlab"
version = "0.1.0"
description = "Isaac Lab locomotion tasks for the LearningRL course repo"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Mark Helwig" }]

# Deliberately empty. Every runtime dependency already exists in the image before
# LearningRLlab is installed (isaaclab*, rsl-rl-lib, gymnasium, torch, warp, wandb, ruff,
# pytest, moviepy). `robot_description` is deliberately NOT listed here even though
# LearningRLlab imports it at runtime (directly, in each task's env cfg) -- it's a private,
# path-installed package with no PyPI presence, so declaring it would make
# `pip install -e` try to resolve it against PyPI and fail. Install order (F1) is
# enforced by convention instead: robot_description before LearningRLlab.
dependencies = []

[project.optional-dependencies]
dev = ["ruff"]

[tool.setuptools.packages.find]
include = ["LearningRLlab", "LearningRLlab.*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "C90", "SIM", "RET"]
# E402: LearningRLlab's own scripts follow Isaac Lab's AppLauncher-first pattern (simulation
# app setup must happen before any Isaac Sim import), which necessarily puts imports
# after code.
ignore = [
    "E402",
    "RET504",
    "RET505",
    "SIM102",
    "SIM103",
    "SIM108",
    "SIM117",
    "SIM118",
    "UP006",
    "UP018",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.mccabe]
max-complexity = 30

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
# Mirrors Isaac Lab's own isort section order so a diff against an upstream
# env/agent cfg file stays reviewable line for line.
section-order = [
    "future",
    "standard-library",
    "third-party",
    "isaaclab",
    "isaaclab-contrib",
    "isaaclab-rl",
    "isaaclab-tasks",
    "isaaclab-assets",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.isort.sections]
isaaclab = ["isaaclab"]
isaaclab-contrib = ["isaaclab_contrib"]
isaaclab-rl = ["isaaclab_rl"]
isaaclab-tasks = ["isaaclab_tasks"]
isaaclab-assets = ["isaaclab_assets"]

[tool.pytest.ini_options]
markers = [
    "static: tests that need no GPU, no Isaac Lab, and no container (ruff, AST scans, ...); safe to run on Windows before pushing.",
]
